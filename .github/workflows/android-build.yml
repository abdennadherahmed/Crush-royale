# Builds an installable Android APK in the cloud, without Unity installed locally.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_USERNAME  Unity ID email
#   UNITY_PASSWORD  Unity ID password (Personal license, activated and returned automatically)
# Optional release signing (created with tools/create-keystore.py); without them the APK is debug-signed:
#   ANDROID_KEYSTORE_BASE64  base64 of the keystore file
#   ANDROID_KEYSTORE_PASS    keystore and key password (alias "crushroyale")
# In-game updates (installed APKs download new builds by themselves, see tools/publish-update.ps1):
#   SUPABASE_SERVICE_ROLE_KEY  Supabase secret key (Project Settings > API Keys)
name: Android build

on:
  workflow_dispatch:
    inputs:
      format:
        description: "apk = install on a phone, aab = upload to Google Play"
        type: choice
        options: [apk, aab]
        default: apk
  # The repository is public, so Actions minutes are free and unmetered again and a build on push costs nothing.
  push:
    branches: [master, main, crush-royale-v1]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.0.83f1
  PROJECT_PATH: unity/CrushRoyale

jobs:
  tests:
    name: .NET tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Run engine, server and client tests
        run: dotnet test CrushRoyale.sln -c Release

  android:
    name: Unity Android APK
    # Runs in parallel with the .NET tests (they only guard the shared engine; Unity compiles the same sources).
    # Windows: unity-setup installs Unity Hub reliably there (the Linux Hub install failed on hosted runners).
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Sync shared assemblies, game data and localization
        shell: pwsh
        run: ./tools/sync-unity.ps1

      # Imported assets only change when art, audio or packages change: code-only commits reuse the exact cache
      # (no 2-minute re-upload), and any other commit starts from the previous import.
      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-Android-win-${{ env.UNITY_VERSION }}-${{ hashFiles('unity/CrushRoyale/Packages/manifest.json', 'unity/CrushRoyale/ProjectSettings/**', 'unity/CrushRoyale/Assets/**', '!unity/CrushRoyale/Assets/**/*.cs') }}
          restore-keys: Library-Android-win-${{ env.UNITY_VERSION }}-

      - name: Install Unity with Android support
        id: unity_setup
        # The Unity Hub download sometimes times out on hosted runners: one automatic retry below.
        continue-on-error: true
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          version-file: ${{ env.PROJECT_PATH }}/ProjectSettings/ProjectVersion.txt
          build-targets: Android
          modules: android-sdk-ndk-tools, android-open-jdk
          # No installation cache: a restored editor took as long as a fresh install and then failed to start
          # (exit 0x8007007E, missing module), so every build installs Unity cleanly.
          cache-installation: false
          auto-update-hub: false

      - name: Install Unity with Android support (retry)
        if: steps.unity_setup.outcome == 'failure'
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          version-file: ${{ env.PROJECT_PATH }}/ProjectSettings/ProjectVersion.txt
          build-targets: Android
          modules: android-sdk-ndk-tools, android-open-jdk
          cache-installation: false
          auto-update-hub: false

      - name: Activate Unity Personal license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Restore release keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            Write-Host "No ANDROID_KEYSTORE_BASE64 secret: the APK will be debug-signed."
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP "crushroyale-release.keystore"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64.Trim()))
          "ANDROID_KEYSTORE_PATH=$path" >> $env:GITHUB_ENV
          "ANDROID_KEYSTORE_PASS=$env:KEYSTORE_PASS" >> $env:GITHUB_ENV
          "ANDROID_KEY_ALIAS=crushroyale" >> $env:GITHUB_ENV

      - name: Build APK
        uses: RageAgainstThePixel/unity-action@v3
        with:
          project-path: ${{ env.PROJECT_PATH }}
          build-target: Android
          log-name: android-build
          args: >-
            -quit -batchmode -nographics
            -executeMethod CrushRoyale.EditorTools.CIBuild.BuildAndroid
            -customBuildPath ${{ github.workspace }}/build/Android/CrushRoyale.${{ inputs.format || 'apk' }}
            -androidVersionCode ${{ github.run_number }}
            -fastTestBuild ${{ (inputs.format || 'apk') == 'apk' && 'true' || 'false' }}

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: CrushRoyale-${{ inputs.format || 'apk' }}-${{ github.run_number }}
          path: build/Android/CrushRoyale.${{ inputs.format || 'apk' }}
          retention-days: 14

      - name: Publish for in-game updates
        if: success() && (inputs.format || 'apk') == 'apk'
        shell: pwsh
        env:
          SUPABASE_URL: https://gzivxtzugewlvygnxkhn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: ./tools/publish-update.ps1 -Apk build/Android/CrushRoyale.apk -VersionCode ${{ github.run_number }}

      # The captures are taken against a real account rather than an invented one. The states that break screens are
      # the ones nobody thinks to invent: the bag's Convert button broke precisely because its owner owned every pet.
      # The file this writes is gitignored and never leaves the runner. Without the secret it writes nothing at all
      # and the demo player is used, so a fork still builds.
      - name: Snapshot a real player for the captures
        continue-on-error: true
        env:
          SUPABASE_URL: https://gzivxtzugewlvygnxkhn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: dotnet run --project tools/ProfileSnapshot -- "Escobaros"

      # Tests and screenshots run here rather than in a job of their own: a second job meant installing Unity a
      # second time, and that install timed out on builds 32 and 33, so the screens were never captured once.
      # They run after the APK is uploaded and published, so a broken screen can never cost the build itself.
      - name: Run UI tests (EditMode)
        id: ui_tests
        continue-on-error: true
        uses: RageAgainstThePixel/unity-action@v3
        with:
          project-path: ${{ env.PROJECT_PATH }}
          build-target: Android
          log-name: ui-tests
          args: >-
            -batchmode -runTests -testPlatform EditMode
            -testResults ${{ github.workspace }}/test-results/editmode.xml

      - name: Capture screenshots of every screen
        id: capture
        continue-on-error: true
        # unity-action adds -nographics on its own, which leaves Unity with no graphics device and makes every
        # capture impossible (build 32 failed exactly there). -force-graphics is the documented way to cancel it.
        uses: RageAgainstThePixel/unity-action@v3
        with:
          project-path: ${{ env.PROJECT_PATH }}
          build-target: Android
          log-name: screenshots
          args: >-
            -quit -batchmode -force-graphics
            -executeMethod CrushRoyale.EditorTools.ScreenshotTool.CaptureAll
            -screenshotOutput ${{ github.workspace }}/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ github.run_number }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Unity logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-logs-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/**/*android-build*.log
            ${{ github.workspace }}/**/*ui-tests*.log
            ${{ github.workspace }}/**/*screenshots*.log
            C:/Users/runneradmin/AppData/Local/Unity/Editor/Editor.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail on test or capture failure
        if: steps.ui_tests.outcome == 'failure' || steps.capture.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "UI tests: ${{ steps.ui_tests.outcome }}, screenshot capture: ${{ steps.capture.outcome }}"
          exit 1
