# Builds an installable Android APK in the cloud, without Unity installed locally.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_USERNAME  Unity ID email
#   UNITY_PASSWORD  Unity ID password (Personal license, activated and returned automatically)
# Optional release signing (created with tools/create-keystore.py); without them the APK is debug-signed:
#   ANDROID_KEYSTORE_BASE64  base64 of the keystore file
#   ANDROID_KEYSTORE_PASS    keystore and key password (alias "crushroyale")
name: Android build

on:
  workflow_dispatch:
    inputs:
      format:
        description: "apk = install on a phone, aab = upload to Google Play"
        type: choice
        options: [apk, aab]
        default: apk
  push:
    branches: [master, main, crush-royale-v1]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.0.83f1
  PROJECT_PATH: unity/CrushRoyale

jobs:
  tests:
    name: .NET tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Run engine, server and client tests
        run: dotnet test CrushRoyale.sln -c Release

  android:
    name: Unity Android APK
    # Runs in parallel with the .NET tests (they only guard the shared engine; Unity compiles the same sources).
    # Windows: unity-setup installs Unity Hub reliably there (the Linux Hub install failed on hosted runners).
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Sync shared assemblies, game data and localization
        shell: pwsh
        run: ./tools/sync-unity.ps1

      # Imported assets only change when art, audio or packages change: code-only commits reuse the exact cache
      # (no 2-minute re-upload), and any other commit starts from the previous import.
      - name: Cache Unity Library
        uses: actions/cache@v6
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-Android-win-${{ env.UNITY_VERSION }}-${{ hashFiles('unity/CrushRoyale/Packages/manifest.json', 'unity/CrushRoyale/ProjectSettings/**', 'unity/CrushRoyale/Assets/**', '!unity/CrushRoyale/Assets/**/*.cs') }}
          restore-keys: Library-Android-win-${{ env.UNITY_VERSION }}-

      - name: Install Unity with Android support
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          version-file: ${{ env.PROJECT_PATH }}/ProjectSettings/ProjectVersion.txt
          build-targets: Android
          modules: android-sdk-ndk-tools, android-open-jdk
          # No installation cache: a restored editor took as long as a fresh install and then failed to start
          # (exit 0x8007007E, missing module), so every build installs Unity cleanly.
          cache-installation: false
          auto-update-hub: false

      - name: Activate Unity Personal license
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Restore release keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            Write-Host "No ANDROID_KEYSTORE_BASE64 secret: the APK will be debug-signed."
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP "crushroyale-release.keystore"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64.Trim()))
          "ANDROID_KEYSTORE_PATH=$path" >> $env:GITHUB_ENV
          "ANDROID_KEYSTORE_PASS=$env:KEYSTORE_PASS" >> $env:GITHUB_ENV
          "ANDROID_KEY_ALIAS=crushroyale" >> $env:GITHUB_ENV

      - name: Build APK
        uses: RageAgainstThePixel/unity-action@v3
        with:
          project-path: ${{ env.PROJECT_PATH }}
          build-target: Android
          log-name: android-build
          args: >-
            -quit -batchmode -nographics
            -executeMethod CrushRoyale.EditorTools.CIBuild.BuildAndroid
            -customBuildPath ${{ github.workspace }}/build/Android/CrushRoyale.${{ inputs.format || 'apk' }}
            -androidVersionCode ${{ github.run_number }}
            -fastTestBuild ${{ (inputs.format || 'apk') == 'apk' && 'true' || 'false' }}

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: CrushRoyale-${{ inputs.format || 'apk' }}-${{ github.run_number }}
          path: build/Android/CrushRoyale.${{ inputs.format || 'apk' }}
          retention-days: 14

      - name: Upload Unity logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-logs-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/**/*android-build*.log
            C:/Users/runneradmin/AppData/Local/Unity/Editor/Editor.log
          if-no-files-found: ignore
          retention-days: 14
